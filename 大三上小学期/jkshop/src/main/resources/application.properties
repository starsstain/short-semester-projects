// application.properties - 已修复的配置文件
server.servlet.context-path=/jkshop
server.port=80
spring.datasource.url=jdbc:mysql://localhost:3306/house_manage_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ccbupt.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置
logging.level.com.ccbupt.dao=DEBUG
logging.level.com.ccbupt=DEBUG

# 文件上传大小限制配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

imgurl=c:/eshop/upload/img/
imgpre=img/upload/


