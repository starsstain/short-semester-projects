<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小区物业管理系统</title>
    <script src="js/vue.js"></script>
    <script src="js/base.js"></script>
    <script src="js/axios.min.js"></script>
    <link rel="stylesheet" href="css/webindex.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .login-header p {
            margin: 8px 0 0 0;
            opacity: 0.8;
            font-size: 14px;
        }

        .admin-login-section {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .admin-login-link {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: color 0.3s;
        }

        .admin-login-link i {
            margin-right: 8px;
            color: #3498db;
        }

        .admin-login-link:hover {
            color: #3498db;
        }

        .login-box {
            padding: 30px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #f8f9fa;
        }

        .login-form .form-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            background: white;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
        }

        .forgot-password {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #2980b9, #21618c);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .login-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .login-footer {
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .divider {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #666;
            font-size: 14px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
            z-index: -1;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .wechat {
            background: linear-gradient(135deg, #07c160, #06ad56);
            color: white;
        }

        .qq {
            background: linear-gradient(135deg, #12b7f5, #09a4e0);
            color: white;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: #ecf0f1;
            text-decoration: underline;
        }

        .login-footer-bottom {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 14px;
            margin-top: 20px;
        }

        .logo-container {
            text-align: center;
            padding: 20px 0;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 480px) {
            .login-wrapper {
                margin: 10px;
            }
            
            .login-box {
                padding: 20px;
            }
            
            .login-header {
                padding: 20px 15px;
            }
            
            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 纯登录表单区�?-->
        <div class="login-wrapper">
            <div class="login-container">
                <div class="logo-container">
                    <img src="img/logo.png" alt="小区物业">
                </div>
                
                <div class="login-header">
                    <h2>小区物业管理系统</h2>
                    <p>专业、安全、便捷的物业管理平台</p>
                </div>
                
                <!-- 登录表单 -->
                <div class="login-box">
                    <!-- 管理员登录链�?-->
                    <div class="admin-login-section">
                        <a class="admin-login-link">
                            <i class="fas fa-user-shield"></i> 业主登录
                        </a>
                    </div>
                    <form class="login-form" @submit.prevent="login">
                        <div class="form-group">
                            <<input 
                                type="text" 
                                v-model="user.username"
                                placeholder="请输入用户名/手机号码"
                                required
                                autocomplete="username"
                                class="form-input"
                            >
                        </div>
                        
                        <div class="form-group">
                            <<input 
                                type="password" 
                                v-model="user.password"
                                placeholder="请输入密码"
                                required
                                autocomplete="current-password"
                                class="form-input"
                            >
                        </div>
                        
                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" v-model="rememberMe">
                                <span>记住密码</span>
                            </label>
                            <a href="forgot-password.html" class="forgot-password">忘记密码？</a>
                        </div>
                        
                        <button type="submit" class="login-btn" :disabled="loading">
                            <span v-if="!loading"><i class="fas fa-sign-in-alt"></i> 登录系统</span>
                            <span v-else><i class="fas fa-spinner fa-spin"></i> 登录中...</span>
                        </button>
                        
                        <div class="register-link">
                            还没有账户？<a href="register.html">立即注册</a>
                        </div>
                    </form>
                    
                    <!-- 社交登录 -->
                    <div class="login-footer">
                        <div class="divider">
                            <span>快速登录</span>
                        </div>
                        
                        <div class="social-login">
                             <button class="social-btn wechat" @click="wechatLogin" title="微信登录">
                                <i class="fab fa-weixin"></i>
                            </button>
                            <button class="social-btn qq" @click="qqLogin" title="QQ登录">
                                <i class="fab fa-qq"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 返回首页链接 -->
                <div class="back-home">
                    <a href="index.html">返回首页</a>
                </div>
            </div>
        </div>

        <!-- 简洁页面-->
        <footer class="login-footer-bottom">
            <p>© 2025 小区物业管理系统 版权所有</p>
            <p>服务热线：400-888-8888</p>
        </footer>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                user:{username:'',password:''},
                rememberMe: false,
                loading: false
            },
            methods: {
                login() {
                    if (!this.user.username || !this.user.password) {
                        alert('请输入用户名和密码');
                        return;
                    }
                    
                    this.loading = true;                    
                     setTimeout(() => {
                         axios.post(`${base.url}user/Login`,this.user)
                         .then(response => {
                          	if(response.data.code===200) {   
                                // 保存用户信息到本地存储
                                localStorage.setItem('user', JSON.stringify(response.data.data));                               
                                // 跳转到首页
                                window.location.href = 'index.html';
                            }  else{
								alert(response.data.message);  
							}    
                           
                        }).catch(error => {
                            console.error('登录失败:', error);
                            alert('登录失败，请稍后重试');
                        }).finally(() => {
                            this.loading = false;
                        });
                    }, 1000);
                },
                
                wechatLogin() {
                    alert('微信登录功能开发中...');
                },
                
                qqLogin() {
                    alert('QQ登录功能开发中...');
                },
                
                // 检查是否已登录
                checkLoginStatus() {
                    var userStr = localStorage.getItem('user');
                    if (userStr) {
                        try {
                            var user = JSON.parse(userStr);
                            if (user && user.name) {
                                // 如果已登录，跳转到首�?
                                //window.location.href = 'index.html';
                            }
                        } catch (e) {
                            // 解析失败，继续留在登录页
                        }
                    }
                },
                
                // 加载保存的用户名
                loadRememberedUsername() {
                    var rememberedUsername = localStorage.getItem('rememberedUsername');
                    if (rememberedUsername) {
                        this.username = rememberedUsername;
                        this.rememberMe = true;
                    }
                }
            },
            created() {
                this.checkLoginStatus();
                this.loadRememberedUsername();
            }
        });
    </script>
</body>
</html>
