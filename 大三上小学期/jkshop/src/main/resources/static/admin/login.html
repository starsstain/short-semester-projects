<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小区管理系统</title>
    <script src="../js/vue.js"></script>
    <script src="../js/base.js"></script>
    <script src="../js/axios.min.js"></script>
    <link rel="stylesheet" href="../css/webindex.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container" id="app">
        <!-- 纯登录表单区域 -->
        <div class="login-wrapper">
            <div class="login-container">
                 
                
                <!-- 登录表单 -->
                <div class="login-box">
					<!-- 管理员登录链接 -->
				    <div class="admin-login-section">
				        <a   class="admin-login-link">
				            <i class="fas fa-user-shield"></i> 管理员登录
				        </a>
				    </div>
                    <form class="login-form" @submit.prevent="login">
                        <div class="form-group">
                            <input 
                                type="text" 
                                v-model="user.username"
                                placeholder="用户名"
                                required
                                autocomplete="username"
                                class="form-input"
                            >
                        </div>
                        
                        <div class="form-group">
                            <input 
                                type="password" 
                                v-model="user.password"
                                placeholder="密码"
                                required
                                autocomplete="current-password"
                                class="form-input"
                            >
                        </div>
                        
                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" v-model="rememberMe">
                                <span>记住密码</span>
                            </label>
                            <a href="forgot-password.html" class="forgot-password">忘记密码？</a>
                        </div>
                        
                        <button type="submit" class="login-btn" :disabled="loading">
                            <span v-if="!loading">登录</span>
                            <span v-else>登录中...</span>
                        </button>
                        
                        <div class="register-link">
                            还没有账号？<a href="register.html">立即注册</a>
                        </div>
                    </form>
                    
                    <!-- 社交登录 -->
                    <div class="login-footer">
                        <div class="divider">
                            <span>快速登录</span>
                        </div>
                        
                        <div class="social-login">
                             <button class="social-btn wechat" @click="wechatLogin" title="微信登录">
						        <i class="fab fa-weixin"></i>
						    </button>
						    <button class="social-btn qq" @click="qqLogin" title="QQ登录">
						        <i class="fab fa-qq"></i>
						    </button>
                        </div>
                    </div>
                </div>
                
                <!-- 返回首页链接 -->
                <div class="back-home">
                    <a href="index.html">← 返回首页</a>
                </div>
            </div>
        </div>

        <!-- 简洁页脚 -->
        <footer class="login-footer-bottom">
            <p>© 2025 小区管理系统 版权所有</p>
        </footer>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
				user:{username:'',password:''},
                rememberMe: false,
                loading: false
            },
            methods: {
                login() {
                    if (!this.user.username || !this.user.password) {
                        alert('请输入用户名和密码');
                        return;
                    }
                    
                    this.loading = true;                    
                     setTimeout(() => {
                         axios.post(`${base.url}user/AdminLogin`,this.user)
                         .then(response => {
                          	if(response.data.code===200) {   
                                // 保存用户信息到本地存储
                                localStorage.setItem('user', JSON.stringify(response.data.data));                               
                                // 跳转到首页
                                window.location.href = 'index.html';
                            }  else{
								alert(response.data.message);  
							}    
                           
                        }).catch(error => {
                            console.error('登录失败:', error);
                            alert('登录失败，请稍后重试');
                        }).finally(() => {
                            this.loading = false;
                        });
                    }, 1000);
                },
                
                wechatLogin() {
                    alert('微信登录功能开发中...');
                },
                
                qqLogin() {
                    alert('QQ登录功能开发中...');
                },
                
                // 检查是否已登录
                checkLoginStatus() {
                    var userStr = localStorage.getItem('user');
                    if (userStr) {
                        try {
                            var user = JSON.parse(userStr);
                            if (user && user.name) {
                                // 如果已登录，跳转到首页
                                //window.location.href = 'index.html';
                            }
                        } catch (e) {
                            // 解析失败，继续留在登录页
                        }
                    }
                },
                
                // 加载保存的用户名
                loadRememberedUsername() {
                    var rememberedUsername = localStorage.getItem('rememberedUsername');
                    if (rememberedUsername) {
                        this.username = rememberedUsername;
                        this.rememberMe = true;
                    }
                }
            },
            created() {
                this.checkLoginStatus();
                this.loadRememberedUsername();
            }
        });
    </script>
</body>
</html>
