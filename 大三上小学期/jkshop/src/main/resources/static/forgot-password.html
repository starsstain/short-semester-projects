<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 小区物业管理系统</title>
    <script src="js/vue.js"></script>
    <script src="js/base.js"></script>
    <script src="js/axios.min.js"></script>
    <link rel="stylesheet" href="css/webindex.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .login-header p {
            margin: 8px 0 0 0;
            opacity: 0.8;
            font-size: 14px;
        }

        .admin-login-section {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .admin-login-link {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: color 0.3s;
        }

        .admin-login-link i {
            margin-right: 8px;
            color: #3498db;
        }

        .admin-login-link:hover {
            color: #3498db;
        }

        .login-box {
            padding: 30px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #f8f9fa;
        }

        .login-form .form-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            background: white;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
        }

        .forgot-password {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #2980b9, #21618c);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .login-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .login-footer {
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .divider {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #666;
            font-size: 14px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
            z-index: -1;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .wechat {
            background: linear-gradient(135deg, #07c160, #06ad56);
            color: white;
        }

        .qq {
            background: linear-gradient(135deg, #12b7f5, #09a4e0);
            color: white;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: #ecf0f1;
            text-decoration: underline;
        }

        .login-footer-bottom {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 14px;
            margin-top: 20px;
        }

        .logo-container {
            text-align: center;
            padding: 20px 0;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
        }

        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 5px;
        }

        .code-container {
            display: flex;
            gap: 10px;
        }

        .code-container .form-input {
            flex: 1;
        }

        .send-code-btn {
            padding: 0 20px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-code-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #27ae60, #229954);
        }

        .send-code-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .login-wrapper {
                margin: 10px;
            }
            
            .login-box {
                padding: 20px;
            }
            
            .login-header {
                padding: 20px 15px;
            }
            
            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .code-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 纯忘记密码表单区域 -->
        <div class="login-wrapper">
            <div class="login-container">
                <div class="logo-container">
                    <img src="img/logo.png" alt="小区物业">
                </div>
                
                <div class="login-header">
                    <h2>小区物业管理系统</h2>
                    <p>专业、安全、便捷的物业管理平台</p>
                </div>
                
                <!-- 忘记密码表单 -->
                <div class="login-box">
                    <!-- 密码找回标题 -->
                    <div class="admin-login-section">
                        <a class="admin-login-link">
                            <i class="fas fa-lock"></i> 密码找回
                        </a>
                    </div>
                    <form class="login-form" @submit.prevent="resetPassword">
                        <div class="form-group">
                            <input 
                                type="text" 
                                v-model="user.username"
                                placeholder="请输入用户名"
                                required
                                autocomplete="username"
                                class="form-input"
                            >
                            <div v-if="errors.username" class="error-message">{{ errors.username }}</div>
                        </div>
                        
                        <div class="form-group">
                            <input 
                                type="tel" 
                                v-model="user.phone"
                                placeholder="请输入绑定的手机号码"
                                required
                                class="form-input"
                            >
                            <div v-if="errors.phone" class="error-message">{{ errors.phone }}</div>
                        </div>
                        
                        <div class="form-group">
                            <div class="code-container">
                                <input 
                                    type="text" 
                                    v-model="user.verificationCode"
                                    placeholder="请输入验证码"
                                    required
                                    class="form-input"
                                >
                                <button 
                                    type="button" 
                                    class="send-code-btn" 
                                    @click="sendVerificationCode" 
                                    :disabled="sendingCode || countDown > 0"
                                >
                                    {{ countDown > 0 ? countDown + '秒后重发' : '获取验证码' }}
                                </button>
                            </div>
                            <div v-if="errors.verificationCode" class="error-message">{{ errors.verificationCode }}</div>
                        </div>
                        
                        <div class="form-group">
                            <input 
                                type="password" 
                                v-model="user.newPassword"
                                placeholder="请输入新密码"
                                required
                                autocomplete="new-password"
                                class="form-input"
                            >
                            <div v-if="errors.newPassword" class="error-message">{{ errors.newPassword }}</div>
                        </div>
                        
                        <div class="form-group">
                            <input 
                                type="password" 
                                v-model="user.confirmPassword"
                                placeholder="请确认新密码"
                                required
                                autocomplete="new-password"
                                class="form-input"
                            >
                            <div v-if="errors.confirmPassword" class="error-message">{{ errors.confirmPassword }}</div>
                        </div>
                        
                        <button type="submit" class="login-btn" :disabled="loading">
                            <span v-if="!loading"><i class="fas fa-sync-alt"></i> 重置密码</span>
                            <span v-else><i class="fas fa-spinner fa-spin"></i> 重置中...</span>
                        </button>
                        
                        <div class="register-link">
                            想起密码了？<a href="login.html">立即登录</a>
                        </div>
                    </form>
                </div>
                
                <!-- 返回首页链接 -->
                <div class="back-home">
                    <a href="index.html">返回首页</a>
                </div>
            </div>
        </div>

        <!-- 简洁页面 -->
        <footer class="login-footer-bottom">
            <p>© 2025 小区物业管理系统 版权所有</p>
            <p>服务热线：400-888-8888</p>
        </footer>
    </div>
    
    <script>
        new Vue({
            el: '#app',
            data: {
                user: {
                    username: '',
                    phone: '',
                    verificationCode: '',
                    newPassword: '',
                    confirmPassword: ''
                },
                loading: false,
                sendingCode: false,
                countDown: 0,
                errors: {}
            },
            methods: {
                resetPassword() {
                    // 表单验证
                    if (!this.validateForm()) {
                        return;
                    }
                    
                    this.loading = true;
                    
                    // 模拟重置密码请求
                    setTimeout(() => {
                        axios.post(`${base.url}user/ResetPassword`, {
                            username: this.user.username,
                            phone: this.user.phone,
                            verificationCode: this.user.verificationCode,
                            newPassword: this.user.newPassword
                        })
                        .then(response => {
                            if (response.data.code === 200) {
                                alert('密码重置成功！请使用新密码登录');
                                window.location.href = 'login.html';
                            } else {
                                alert(response.data.message || '密码重置失败，请稍后重试');
                            }
                        })
                        .catch(error => {
                            console.error('密码重置失败:', error);
                            alert('密码重置失败，请稍后重试');
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                    }, 1000);
                },
                
                sendVerificationCode() {
                    // 验证用户名和手机号码
                    if (!this.user.username.trim()) {
                        alert('请输入用户名');
                        return;
                    }
                    
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!this.user.phone.trim() || !phoneRegex.test(this.user.phone)) {
                        alert('请输入正确的手机号码');
                        return;
                    }
                    
                    this.sendingCode = true;
                    
                    // 模拟发送验证码请求
                    setTimeout(() => {
                        // 发送验证码成功
                        this.sendingCode = false;
                        this.countDown = 60;
                        
                        // 倒计时
                        const timer = setInterval(() => {
                            this.countDown--;
                            if (this.countDown <= 0) {
                                clearInterval(timer);
                            }
                        }, 1000);
                        
                        alert('验证码已发送到您的手机，请注意查收');
                    }, 1000);
                },
                
                validateForm() {
                    this.errors = {};
                    
                    // 用户名验证
                    if (!this.user.username.trim()) {
                        this.errors.username = '请输入用户名';
                    }
                    
                    // 手机号码验证
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!this.user.phone.trim()) {
                        this.errors.phone = '请输入手机号码';
                    } else if (!phoneRegex.test(this.user.phone)) {
                        this.errors.phone = '请输入正确的手机号码格式';
                    }
                    
                    // 验证码验证
                    if (!this.user.verificationCode.trim()) {
                        this.errors.verificationCode = '请输入验证码';
                    } else if (this.user.verificationCode.length !== 6) {
                        this.errors.verificationCode = '验证码长度为6位';
                    }
                    
                    // 新密码验证
                    if (!this.user.newPassword) {
                        this.errors.newPassword = '请输入新密码';
                    } else if (this.user.newPassword.length < 6) {
                        this.errors.newPassword = '密码长度不能少于6个字符';
                    }
                    
                    // 确认新密码验证
                    if (!this.user.confirmPassword) {
                        this.errors.confirmPassword = '请确认新密码';
                    } else if (this.user.newPassword !== this.user.confirmPassword) {
                        this.errors.confirmPassword = '两次输入的密码不一致';
                    }
                    
                    return Object.keys(this.errors).length === 0;
                }
            }
        });
    </script>
</body>
</html>
